plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.watabou.pixeldungeon'
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.watabou.pixeldungeon"
        minSdk 21
        targetSdk 35
        versionCode 75
        versionName "0.1.0-xianxia"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
